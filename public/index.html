<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" /> -->
    <link id="datai-favicon" rel="shortcut icon" href="favicon.ico"  type="image/x-icon" />
    <link rel="stylesheet" type="text/css" href="<%= publicPath %>css/reset.css" />
    <title id="datai-title">面向数字孪生的低代码平台</title>
    <style>
      body {
        line-height: 1;
      }
    
      #i-loading {
        background: #fff;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        position: fixed;
        z-index: 999;
        transition: all .5s ease-out
      }
    
      #i-loading .loading-center {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- <div id="i-loading" style="background: #040C1F; display: none;">
          <div class="loading-center">
            <img class="loading-img" src="<%= publicPath %>loading.png">
          </div>
        </div> -->
    <script>
      window.publicPath = '<%= publicPath %>'; // 运行时前端目录,部署在非根目录下方便查找前端资源
    </script>
    <script src="<%= publicPath %>libs/loading.js"></script>

    <% if(process.env.NODE_ENV === 'production') { %>
      <script src="<%= publicPath %>libs/react/react.min.js"></script>
      <script src="<%= publicPath %>libs/react/react-dom.js"></script>
    <% } else { %>
      <!-- 开发环境先还是用正式版，否则组件库警告太多，需要时间改 -->
      <script src="<%= publicPath %>libs/react/react.development.js"></script>
      <script src="<%= publicPath %>libs/react/react-dom.development.js"></script>
    <% } %>
  </body>

</html>
